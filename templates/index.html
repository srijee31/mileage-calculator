<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijeeth's Bike Mileage Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            padding: 20px;
        }

        .calculator-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(129, 151, 228, 0.9);
            border-radius: 24px;
            padding: 36px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Top Accent Glow Line */
        .calculator-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #6366f1, #a855f7);
        }

        /* Top Bar with Title and Reset Button */
        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .header {
            text-align: left;
        }

        .header .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Refresh/Reset Button */
        .reset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
            transform: rotate(180deg);
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Position suffix labels on the RIGHT side */
        .input-icon {
            position: absolute;
            right: 14px;
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 700;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 14px 45px 14px 16px; /* Added right padding so text doesn't overlap the suffix */
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Hide HTML5 numeric spin arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Results Display Grid */
        .results-container {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(99, 102, 241, 0.1));
            border: 1px solid rgba(56, 189, 248, 0.25);
            grid-column: span 2;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .stat-card.highlight .stat-value {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="card-top-bar">
        <div class="header">
            <span class="badge">Srijeeth's Tool</span>
            <h1>Bike Mileage Calculator</h1>
        </div>
        <a href="/" class="reset-btn" title="Reset all inputs">↺</a>
    </div>

    <form method="POST">
        <div class="input-group">
            <label for="price">Petrol Price</label>
            <div class="input-wrapper">
                <input type="number" step="any" id="price" name="price" value="{{ price if price else '' }}" placeholder="Enter price" required>
                <span class="input-icon">₹</span>
            </div>
        </div>

        <div class="input-group">
            <label for="amount">Total Fueled</label>
            <div class="input-wrapper">
                <input type="number" step="any" id="amount" name="amount" value="{{ amount if amount else '' }}" placeholder="Enter amount" required>
                <span class="input-icon">₹</span>
            </div>
        </div>
        
        <div class="input-group">
            <label for="distance">Distance Traveled</label>
            <div class="input-wrapper">
                <input type="number" step="any" id="distance" name="distance" value="{{ distance if distance else '' }}" placeholder="Enter distance" required>
                <span class="input-icon">km</span>
            </div>
        </div>
        
        <button type="submit" class="submit-btn">Calculate Mileage</button>
    </form>

    {% if mileage is not none %}
        <div class="results-container">
            <div class="stat-card">
                <div class="stat-label">Petrol Fueled</div>
                <div class="stat-value" style="color: #f8fafc;">{{ liters_fueled }} <span style="font-size: 0.9rem; font-weight: 600;">L</span></div>
            </div>

            <div class="stat-card highlight">
                <div class="stat-label">Average Mileage</div>
                <div class="stat-value">{{ mileage }} <span style="font-size: 1.1rem; font-weight: 700;">km/L</span></div>
            </div>
        </div>
    {% endif %}
</div>

</body>
</html>
